spring:
  application:
    name: portal-server
  profiles:
    active: test
  cloud:
    nacos:
      discovery:
        server-addr: 10.30.1.20:8848
        namespace: espace-yyht-ky
        ip: 127.0.0.1
      config:
        server-addr: 10.30.1.20:8848
        #命名空间
        namespace: espace-yyht-ky
        #group
        group: ${spring.application.name}
        #配置文件前缀
        prefix: ${spring.application.name}
        #指定配置文件格式
        file-extension: yml
        #是否启用nacos
        enabled: true
        #是否启用配置自动更新 须配合@RefreshScope使用
        refresh-enabled: true
        #超时时间
        timeout: 3000
        #扩展配置
        #多项目共享配置
        shared-configs:
        - data-id: share-config-${spring.profiles.active}.yml
          group: DEFAULT_GROUP
          refresh: true
        #项目共享配置
        extension-configs:
        - data-id: portal-share-config.yml
          group: DEFAULT_GROUP
          refresh: true
  datasource:
    hikari:
      maxLifetime: 60000
      keepaliveTime: 30000
      validationTimeout: 5000
      connectionTimeout: 30000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

portal:
  ptk:
    ttlSeconds: 600
  userAuth:
    cacheTtlSeconds: 600
  events:
    streamKey: portal:events
  wechat:
    miniProgram:
      appId: ${WECHAT_MINI_APP_ID:}
      appSecret: ${WECHAT_MINI_APP_SECRET:}
      jsCode2SessionUrl: https://api.weixin.qq.com/sns/jscode2session
    app:
      appId: ${WECHAT_APP_ID:}
      appSecret: ${WECHAT_APP_SECRET:}
      oauthAccessTokenUrl: https://api.weixin.qq.com/sns/oauth2/access_token
